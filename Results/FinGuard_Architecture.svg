<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">FinGuard real-time fraud detection architecture</title>
  <desc id="description">Kafka transactions, a fraud watchlist, and customer data flow through Databricks Bronze, Silver, and Gold processing to alerts and dashboards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .small { font-size: 15px; fill: #526179; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
      .card { fill: #fff; stroke: #d7e1ed; stroke-width: 2; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="900" rx="28" fill="url(#background)"/>
  <rect x="0" y="0" width="1500" height="150" rx="28" fill="url(#brand)"/>
  <rect x="0" y="120" width="1500" height="30" fill="url(#brand)"/>
  <text x="72" y="73" font-size="42" font-weight="800" fill="#fff">FinGuard</text>
  <text x="74" y="111" font-size="19" fill="#d8f3ed">Real-time fraud detection | Databricks + Kafka</text>
  <text x="1425" y="76" text-anchor="end" font-size="16" font-weight="600" fill="#d8f3ed">STREAM • VALIDATE • ALERT</text>

  <text x="72" y="205" class="label" fill="#0f766e">DATA SOURCES</text>
  <rect x="64" y="228" width="270" height="115" rx="16" class="card"/>
  <circle cx="101" cy="271" r="15" fill="#f97316"/>
  <text x="128" y="268" font-size="20" font-weight="700">Kafka transactions</text>
  <text x="91" y="310" class="small">Live card transaction events</text>

  <rect x="64" y="365" width="270" height="115" rx="16" class="card"/>
  <circle cx="101" cy="408" r="15" fill="#14b8a6"/>
  <text x="128" y="405" font-size="20" font-weight="700">Fraud watchlist</text>
  <text x="91" y="447" class="small">JSON files ingested by Auto Loader</text>

  <rect x="64" y="502" width="270" height="115" rx="16" class="card"/>
  <circle cx="101" cy="545" r="15" fill="#3b82f6"/>
  <text x="128" y="542" font-size="20" font-weight="700">Customer data</text>
  <text x="91" y="584" class="small">PostgreSQL customer limits</text>

  <rect x="390" y="210" width="760" height="444" rx="22" fill="#fff" stroke="#bfd0e2" stroke-width="2"/>
  <text x="770" y="250" text-anchor="middle" font-size="24" font-weight="800">DATABRICKS • MEDALLION PIPELINE</text>
  <text x="770" y="278" text-anchor="middle" class="small">Unity Catalog | Spark Structured Streaming | Delta Lake</text>

  <rect x="425" y="310" width="210" height="188" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="530" y="350" text-anchor="middle" font-size="23" font-weight="800" fill="#c2410c">BRONZE</text>
  <text x="530" y="381" text-anchor="middle" class="label">Raw ingestion</text>
  <text x="450" y="424" class="small">• Kafka event stream</text>
  <text x="450" y="453" class="small">• Watchlist file stream</text>
  <text x="450" y="482" class="small">• Source metadata retained</text>

  <rect x="665" y="310" width="210" height="188" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="770" y="350" text-anchor="middle" font-size="23" font-weight="800" fill="#1d4ed8">SILVER</text>
  <text x="770" y="381" text-anchor="middle" class="label">Clean &amp; conform</text>
  <text x="690" y="424" class="small">• Parse and validate</text>
  <text x="690" y="453" class="small">• Normalize event fields</text>
  <text x="690" y="482" class="small">• Enrich customer data</text>

  <rect x="905" y="310" width="210" height="188" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="1010" y="350" text-anchor="middle" font-size="23" font-weight="800" fill="#15803d">GOLD</text>
  <text x="1010" y="381" text-anchor="middle" class="label">Fraud signals</text>
  <text x="930" y="424" class="small">• Limit-breach detection</text>
  <text x="930" y="453" class="small">• Watchlist matching</text>
  <text x="930" y="482" class="small">• Windowed metrics</text>

  <path d="M635 405h24" class="flow"/>
  <path d="M875 405h24" class="flow"/>
  <path d="M334 285h42v88h42" class="flow"/>
  <path d="M334 422h42v-10h42" class="flow"/>
  <path d="M334 559h42v-120h42" class="flow"/>

  <rect x="425" y="530" width="690" height="88" rx="14" fill="#f8fafc" stroke="#d7e1ed" stroke-width="2"/>
  <text x="770" y="565" text-anchor="middle" class="label">TRUST &amp; OPERATIONS</text>
  <text x="770" y="594" text-anchor="middle" class="small">Data quality • Checkpointing • Stateful processing • Observability</text>

  <text x="1200" y="205" class="label" fill="#0f766e">SERVING</text>
  <rect x="1180" y="250" width="260" height="150" rx="16" class="card"/>
  <circle cx="1220" cy="294" r="15" fill="#ef4444"/>
  <text x="1248" y="291" font-size="20" font-weight="700">Email alerts</text>
  <text x="1208" y="337" class="small">High-value transaction</text>
  <text x="1208" y="364" class="small">and watchlist notifications</text>

  <rect x="1180" y="430" width="260" height="150" rx="16" class="card"/>
  <circle cx="1220" cy="474" r="15" fill="#6366f1"/>
  <text x="1248" y="471" font-size="20" font-weight="700">Dashboards</text>
  <text x="1208" y="517" class="small">Fraud signals and transaction</text>
  <text x="1208" y="544" class="small">metrics in Databricks SQL</text>

  <path d="M1150 355h20v-30h10" class="flow"/>
  <path d="M1150 452h20v53h10" class="flow"/>

  <rect x="64" y="710" width="1376" height="112" rx="18" fill="#e2f5f1" stroke="#99d7c9" stroke-width="2"/>
  <text x="100" y="755" font-size="19" font-weight="800" fill="#115e59">END-TO-END</text>
  <text x="100" y="785" font-size="19" font-weight="800" fill="#115e59">FLOW</text>
  <text x="300" y="775" font-size="19" font-weight="600">Generate events</text>
  <path d="M455 769h76" class="flow"/>
  <text x="550" y="775" font-size="19" font-weight="600">Ingest &amp; validate</text>
  <path d="M730 769h76" class="flow"/>
  <text x="825" y="775" font-size="19" font-weight="600">Detect &amp; enrich</text>
  <path d="M985 769h76" class="flow"/>
  <text x="1080" y="775" font-size="19" font-weight="600">Alert &amp; monitor</text>
</svg>
